name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile production and tests
        run: ./gradlew compileJava compileTestJava --no-daemon --max-workers=1

      - name: Validate Clean Architecture structure
        run: ./gradlew vs --no-daemon --max-workers=1

      - name: Run tests
        run: ./gradlew test --no-daemon --max-workers=1